<nav class="bg-gray-200 dark:bg-gray-800 border-b-4 {{ accent_color|default:'border-yellow-500' }} p-4 shadow-md flex-shrink-0 transition-colors duration-200 relative z-40">
    <div class="container mx-auto flex flex-wrap justify-between items-center">

        <h1 class="text-xl font-black text-gray-800 dark:text-white uppercase tracking-wider">
            {{ nav_title|default:'Panel de Control' }}
        </h1>

        <div class="flex items-center gap-2 sm:gap-4">

            <button onclick="toggleDarkMode()" class="p-2 bg-gray-300 dark:bg-gray-700 rounded-full hover:bg-gray-400 dark:hover:bg-gray-600 transition text-gray-800 dark:text-yellow-400" title="Cambiar Tema">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                </svg>
            </button>

            <a href="{% url 'portal_principal' %}" class="p-2 bg-gray-300 dark:bg-gray-700 rounded-full hover:bg-blue-200 dark:hover:bg-blue-900/50 transition text-gray-700 dark:text-gray-200 hover:text-blue-600 dark:hover:text-blue-400" title="Ir al Portal Principal">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                </svg>
            </a>

            <div class="relative">
                <button onclick="toggleMenu()" class="p-2 bg-gray-300 dark:bg-gray-700 rounded-lg hover:bg-gray-400 dark:hover:bg-gray-600 transition text-gray-700 dark:text-gray-200 flex items-center focus:outline-none focus:ring-2 focus:ring-gray-400" title="Menú de Opciones">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

                <div id="mobile-menu" class="hidden absolute right-0 mt-3 w-56 bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden transform origin-top-right transition-all z-50">
                    <div class="py-2">

                        {% for item in nav_items %}
                        <a href="{{ item.url }}" class="block px-5 py-3 text-sm font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-{{ item.hover_color|default:'yellow-600' }} transition">
                            {{ item.label }}
                        </a>
                        {% endfor %}

                        <div class="px-5 py-1">
                            {% block extra_nav %}{% endblock %}
                        </div>

                        <div class="border-t border-gray-200 dark:border-gray-700 my-2"></div>

                        <form method="POST" action="{% url 'logout' %}" class="block w-full">
                            {% csrf_token %}
                            <button type="submit" class="w-full text-left px-5 py-3 text-sm font-bold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                </svg>
                                Cerrar Sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</nav>

<script>
    function toggleMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }

    // Cerrar el menú si el usuario hace clic en cualquier otro lado de la pantalla
    window.addEventListener('click', function(e) {
        const menu = document.getElementById('mobile-menu');
        const button = e.target.closest('button[onclick="toggleMenu()"]');
        if (!button && menu && !menu.contains(e.target)) {
            menu.classList.add('hidden');
        }
    });
</script>
