<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema POS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans transition-colors duration-200 h-screen flex flex-col{% endblock %}" {% block body_extra %}{% endblock %} hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    {% block nav %}
    {% include "base/nav.html" %}
    {% endblock %}

    {% block main_container %}
    <main class="{% block main_class %}container mx-auto p-4 sm:p-8 flex-grow flex flex-col justify-center max-w-5xl{% endblock %}">
        {% block content %}
        {% endblock %}
    </main>
    {% endblock %}

    <!-- Modal Global -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div id="modal-content" class="w-full max-w-2xl transform transition-all"></div>
    </div>

    <script>
        // Función para cerrar el modal
        function cerrarModal() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            if (modal) modal.classList.add('hidden');
            if (content) content.innerHTML = '';
        }

        // Cerrar al hacer click fuera del contenido
        window.onclick = function(event) {
            const modal = document.getElementById('modal-container');
            if (event.target == modal) cerrarModal();
        }

        // Cerrar con la tecla Escape
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') cerrarModal();
        });

        // Mostrar modal automáticamente cuando HTMX carga contenido en el target
        document.addEventListener('htmx:afterOnLoad', function(evt) {
            if (evt.detail.target.id === 'modal-content') {
                document.getElementById('modal-container').classList.remove('hidden');
            }
        });

        // También cerrar modal si la respuesta de HTMX indica éxito en un formulario (opcional)
        // O si se redirige la página completa.
    </script>

    {% block extra_body %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
