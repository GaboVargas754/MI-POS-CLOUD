<div class="bg-white dark:bg-gray-800 rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
    <div class="sticky top-0 z-10 bg-gray-100 dark:bg-gray-700 border-b-4 border-purple-600 dark:border-purple-500 p-4 flex justify-between items-center">
        <h2 class="text-xl font-black text-gray-800 dark:text-white uppercase tracking-wider">{{ titulo }}</h2>
        <button onclick="cerrarModal()" class="text-gray-500 hover:text-red-500 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <form hx-post="{{ request.path }}" hx-target="body" class="p-4 sm:p-6 space-y-4 pb-6">
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">{{ field.label }}</label>

            <div class="relative">
                {{ field }}
            </div>

            {% if field.errors %}
                <p class="text-red-500 text-xs mt-1 font-bold">{{ field.errors.0 }}</p>
            {% endif %}

            {% if field.name == 'costo' %}
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-1 font-semibold">Si lo dejas en blanco, se registrará como $0.00</p>
            {% endif %}
        </div>
        {% endfor %}

        <div class="flex gap-3 pt-4 sticky bottom-0 bg-white dark:bg-gray-800 py-3">
            <button type="button" onclick="cerrarModal()"
                    class="w-1/2 bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 font-bold py-3 rounded-xl hover:bg-gray-300 dark:hover:bg-gray-500 transition min-h-12">
                Cancelar
            </button>
            <button type="submit"
                    class="w-1/2 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition-colors shadow-lg min-h-12">
                {% if is_instance %}Actualizar{% else %}Guardar{% endif %}
            </button>
        </div>
    </form>
</div>
