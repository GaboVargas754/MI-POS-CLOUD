{% extends "base/base.html" %}

{% block title %}Estadísticas - {{ block.super }}{% endblock %}

{% block content %}
<div class="text-center mb-8 sm:mb-10">
    <h2 class="text-3xl sm:text-4xl font-black text-gray-800 dark:text-white mb-2">Estadísticas de Ventas</h2>
    <p class="text-gray-500 dark:text-gray-400 text-base sm:text-lg">Resumen del día: {{ hoy|date:"d M, Y" }}</p>
</div>

<section id="dashboard-estadisticas-tiempo-real" data-dashboard-live-url="{% url 'dashboard_live' %}">
    {% include 'ventas/partials/dashboard_estadisticas.html' %}
</section>
{% endblock %}

{% block extra_js %}
<script>
    (function() {
        const eventosActualizables = new Set(['venta.creada', 'venta.cancelada']);
        const contenedor = document.getElementById('dashboard-estadisticas-tiempo-real');
        if (!contenedor) return;

        let refrescando = false;
        let refrescarDespues = false;

        async function refrescarEstadisticas() {
            if (refrescando) {
                refrescarDespues = true;
                return;
            }

            refrescando = true;
            contenedor.classList.add('opacity-70');

            try {
                const response = await fetch(contenedor.dataset.dashboardLiveUrl, {
                    credentials: 'same-origin',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                if (!response.ok) throw new Error('No se pudo actualizar el dashboard.');

                contenedor.innerHTML = await response.text();
                if (window.htmx) htmx.process(contenedor);
            } catch (error) {
                console.error(error);
            } finally {
                contenedor.classList.remove('opacity-70');
                refrescando = false;

                if (refrescarDespues) {
                    refrescarDespues = false;
                    refrescarEstadisticas();
                }
            }
        }

        document.addEventListener('pos:notificacion', function(event) {
            const payload = event.detail || {};
            if (eventosActualizables.has(payload.event)) refrescarEstadisticas();
        });
    })();
</script>
{% endblock %}
